<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Mermaid Architect</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mermaid/10.6.1/mermaid.min.js"></script>
    <style>
        /* 简单的 Loading 动画 */
        .spinner { border: 4px solid #f3f3f3; border-top: 4px solid #3b82f6; border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans h-screen flex flex-col">

    <!-- Navbar -->
    <nav class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center">
        <div class="flex items-center gap-2">
            <svg class="w-8 h-8 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.384-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
            <h1 class="text-xl font-bold tracking-tight">AI Mermaid Architect</h1>
        </div>
        <div class="flex gap-4 text-sm font-medium text-slate-600">
            <a href="?lang=en" class="hover:text-blue-600 transition">English</a>
            <a href="?lang=ja" class="hover:text-blue-600 transition">日本語</a>
            <a href="?lang=es" class="hover:text-blue-600 transition">Español</a>
            <a href="?lang=zh" class="hover:text-blue-600 transition">中文</a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="flex flex-1 overflow-hidden">
        
        <!-- Sidebar (Input) -->
        <aside class="w-1/3 bg-white border-r border-slate-200 p-6 flex flex-col gap-6 overflow-y-auto">
            <div>
                <label id="lbl-type" class="block text-sm font-semibold text-slate-700 mb-2">Diagram Type</label>
                <select id="diagramType" class="w-full p-2.5 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
                    <option value="flowchart">Flowchart</option>
                    <option value="sequence">Sequence Diagram</option>
                    <option value="class">Class Diagram</option>
                    <option value="er">ER Diagram</option>
                    <option value="mindmap">Mindmap</option>
                    <option value="gantt">Gantt Chart</option>
                </select>
            </div>

            <div class="flex-1 flex flex-col">
                <label id="lbl-prompt" class="block text-sm font-semibold text-slate-700 mb-2">Description</label>
                <textarea id="promptInput" class="flex-1 w-full p-3 bg-slate-50 border border-slate-300 rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none resize-none" placeholder="e.g. User logs in via OAuth2, system validates token..."></textarea>
            </div>

            <button id="generateBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-lg transition flex justify-center items-center gap-2">
                <span id="btn-text">Generate Diagram</span>
                <div id="loader" class="spinner hidden"></div>
            </button>
            
            <div id="errorMsg" class="hidden text-red-500 text-sm bg-red-50 p-3 rounded border border-red-200"></div>
        </aside>

        <!-- Preview Area -->
        <main class="flex-1 bg-slate-100 relative flex flex-col">
            <div class="absolute top-4 right-4 z-10 flex gap-2">
                <button onclick="downloadSVG()" class="bg-white shadow px-4 py-2 rounded text-sm font-medium hover:bg-slate-50 text-slate-700 border">Download SVG</button>
                <button onclick="downloadPNG()" class="bg-white shadow px-4 py-2 rounded text-sm font-medium hover:bg-slate-50 text-slate-700 border">Download PNG</button>
            </div>
            
            <div class="flex-1 overflow-auto flex items-center justify-center p-8" id="diagramContainer">
                <div id="mermaidOutput" class="w-full h-full flex items-center justify-center text-slate-400">
                    <!-- Mermaid Chart renders here -->
                    <span id="placeholder-text">Diagram will appear here...</span>
                </div>
            </div>
            
            <!-- Raw Code Toggle (Optional) -->
            <div class="bg-white border-t p-2">
                <details>
                    <summary class="cursor-pointer text-xs text-slate-500">View Mermaid Code</summary>
                    <pre id="rawCode" class="text-xs p-2 bg-slate-800 text-green-400 mt-2 rounded overflow-auto max-h-32"></pre>
                </details>
            </div>
        </main>
    </div>

    <script>
        // 1. Configuration & I18n Data
        const WORKER_URL = "https://bold-lab-68a6.spacegun.workers.dev"; // Replace with your Worker URL
        
        const translations = {
            en: { lblType: "Diagram Type", lblPrompt: "Description", btnGen: "Generate Diagram", place: "Diagram will appear here...", promptPlace: "e.g. User logs in via OAuth2..." },
            zh: { lblType: "图表类型", lblPrompt: "描述需求", btnGen: "生成架构图", place: "图表将显示在这里...", promptPlace: "例如：用户通过 OAuth2 登录，系统验证令牌..." },
            ja: { lblType: "図の種類", lblPrompt: "説明", btnGen: "図を生成する", place: "ここに図が表示されます...", promptPlace: "例：ユーザーがOAuth2経由でログインし、システムがトークンを検証する..." },
            es: { lblType: "Tipo de Diagrama", lblPrompt: "Descripción", btnGen: "Generar Diagrama", place: "El diagrama aparecerá aquí...", promptPlace: "ej. Usuario inicia sesión vía OAuth2..." }
        };

        // 2. Init Logic
        const params = new URLSearchParams(window.location.search);
        const currentLang = params.get('lang') || 'en';
        const t = translations[currentLang] || translations.en;

        // Apply Translations
        document.getElementById('lbl-type').innerText = t.lblType;
        document.getElementById('lbl-prompt').innerText = t.lblPrompt;
        document.getElementById('btn-text').innerText = t.btnGen;
        document.getElementById('placeholder-text').innerText = t.place;
        document.getElementById('promptInput').placeholder = t.promptPlace;

        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        // 3. Generation Logic
        document.getElementById('generateBtn').addEventListener('click', async () => {
            const prompt = document.getElementById('promptInput').value;
            const type = document.getElementById('diagramType').value;
            const loader = document.getElementById('loader');
            const btnText = document.getElementById('btn-text');
            const errorDiv = document.getElementById('errorMsg');

            if(!prompt) return;

            // UI Loading State
            loader.classList.remove('hidden');
            btnText.classList.add('hidden');
            errorDiv.classList.add('hidden');

            try {
                const res = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt, diagramType: type, targetLang: currentLang })
                });

                const data = await res.json();
                
                if(data.error) throw new Error(data.error);

                // Render Mermaid
                renderMermaid(data.code);
                document.getElementById('rawCode').innerText = data.code;

            } catch (err) {
                console.error(err);
                errorDiv.innerText = "Error: " + err.message;
                errorDiv.classList.remove('hidden');
            } finally {
                loader.classList.add('hidden');
                btnText.classList.remove('hidden');
            }
        });

        async function renderMermaid(code) {
            const outputDiv = document.getElementById('mermaidOutput');
            outputDiv.innerHTML = ''; // Clear previous
            
            try {
                const { svg } = await mermaid.render('graphDiv', code);
                outputDiv.innerHTML = svg;
                // Add slight zoom/pan capability can be added here or just let SVG scale
                outputDiv.querySelector('svg').style.height = '100%';
                outputDiv.querySelector('svg').style.width = '100%';
            } catch(e) {
                document.getElementById('errorMsg').innerText = "Mermaid Syntax Error (AI Hallucination). Try again.";
                document.getElementById('errorMsg').classList.remove('hidden');
            }
        }

        // 4. Download Helpers
        function downloadSVG() {
            const svgData = document.querySelector('#mermaidOutput svg').outerHTML;
            const blob = new Blob([svgData], {type: 'image/svg+xml'});
            const url = URL.createObjectURL(blob);
            triggerDownload(url, 'architecture.svg');
        }

        function downloadPNG() {
            // Simple approach: Draw SVG to Canvas
            const svg = document.querySelector('#mermaidOutput svg');
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const svgData = new XMLSerializer().serializeToString(svg);
            const img = new Image();
            
            // Set canvas size based on SVG viewBox or bbox
            const bbox = svg.getBoundingClientRect();
            canvas.width = bbox.width * 2; // high res
            canvas.height = bbox.height * 2;

            img.onload = () => {
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                triggerDownload(canvas.toDataURL('image/png'), 'architecture.png');
            };
            
            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        }

        function triggerDownload(url, name) {
            const a = document.createElement('a');
            a.href = url;
            a.download = name;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
        }
    </script>
</body>
</html>
